name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code with ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Save coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  build-image:
    name: Build Docker image
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "nodejs-practicum-demo:$APP_VERSION" .

      - name: Run container and check health
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker run -d \
            --name practicum-test \
            -p 127.0.0.1:3000:3000 \
            "nodejs-practicum-demo:$APP_VERSION"

          trap 'docker logs practicum-test; docker rm -f practicum-test' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:3000/health > health.json; then
              if jq -e --arg version "$APP_VERSION" \
                '.status == "ok" and .version == $version' \
                health.json; then
                echo "Health and release version checks passed"
                exit 0
              fi
            fi

            echo "Waiting for the application: attempt $attempt"
            sleep 3
          done

          echo "Application health check failed"
          exit 1

  publish-image:
    name: Publish Docker image
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "$IMAGE_NAME:$APP_VERSION" .
          docker push "$IMAGE_NAME:$APP_VERSION"

  deploy-test:
    name: Deploy to Kubernetes test environment
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js for deployment scripts
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install kind and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-tools"

          curl --fail --silent --show-error --location \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 \
            -o "$RUNNER_TEMP/k8s-tools/kind"

          curl --fail --silent --show-error --location \
            https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl \
            -o "$RUNNER_TEMP/k8s-tools/kubectl"

          chmod +x "$RUNNER_TEMP/k8s-tools/kind"
          chmod +x "$RUNNER_TEMP/k8s-tools/kubectl"

          echo "$RUNNER_TEMP/k8s-tools" >> "$GITHUB_PATH"

      - name: Create Kubernetes test cluster
        run: kind create cluster --name practicum --wait 120s

      - name: Build image for Kubernetes test
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "nodejs-practicum-demo:$APP_VERSION" .

      - name: Load image into cluster
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          kind load docker-image \
            "nodejs-practicum-demo:$APP_VERSION" \
            --name practicum

      - name: Deploy application
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          bash scripts/deploy.sh \
            "nodejs-practicum-demo:$APP_VERSION"

      - name: Verify application health and version
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          kubectl --context kind-practicum -n test \
            port-forward service/practicum-app 8080:80 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &

          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT

          bash scripts/smoke-test.sh \
            http://127.0.0.1:8080 "$APP_VERSION"
    
      - name: Test automatic rollback after a failed update
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          BASELINE_REVISION=$(kubectl --context kind-practicum \
            -n test get deployment practicum-app \
            -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')

          echo "Known healthy revision: $BASELINE_REVISION"

          # Deliberately make the updated Pods fail readiness checks.
          kubectl --context kind-practicum -n test \
            patch deployment practicum-app --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"app","readinessProbe":{"httpGet":{"path":"/intentional-failure","port":"http"}}}]}}}}'

          if kubectl --context kind-practicum -n test \
            rollout status deployment/practicum-app --timeout=60s; then
            echo "Unexpected result: the broken update succeeded"
            exit 1
          fi

          echo "Update failed as expected; restoring the healthy revision"

          bash scripts/rollback.sh "$BASELINE_REVISION"

          kubectl --context kind-practicum -n test \
            port-forward service/practicum-app 8080:80 \
            > "$RUNNER_TEMP/rollback-port-forward.log" 2>&1 &

          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT

          bash scripts/smoke-test.sh \
            http://127.0.0.1:8080 "$APP_VERSION"

          echo "Automatic rollback and recovery verified"

      - name: Show Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-practicum -n test \
            get pods,deployments,services || true

          kubectl --context kind-practicum -n test \
            describe pods || true

      - name: Delete temporary cluster
        if: always()
        run: kind delete cluster --name practicum