name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code with ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Save coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  build-image:
    name: Build Docker image
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "nodejs-practicum-demo:$APP_VERSION" .

      - name: Run container and check health
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker run -d \
            --name practicum-test \
            -p 127.0.0.1:3000:3000 \
            "nodejs-practicum-demo:$APP_VERSION"

          trap 'docker logs practicum-test; docker rm -f practicum-test' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:3000/health > health.json; then
              if jq -e --arg version "$APP_VERSION" \
                '.status == "ok" and .version == $version' \
                health.json; then
                echo "Health and release version checks passed"
                exit 0
              fi
            fi

            echo "Waiting for the application: attempt $attempt"
            sleep 3
          done

          echo "Application health check failed"
          exit 1